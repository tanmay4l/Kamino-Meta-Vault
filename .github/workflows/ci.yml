name: ci

on:
  push:
  pull_request:

env:
  ANCHOR_CLI_VERSION: "1.0.0"
  RUST_TOOLCHAIN: "1.89.0"
  SOLANA_CLI_VERSION: "v3.1.10"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: yarn

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Install Solana CLI
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${SOLANA_CLI_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI
        shell: bash
        run: |
          cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_CLI_VERSION}" avm --locked --force
          avm install "${ANCHOR_CLI_VERSION}"
          avm use "${ANCHOR_CLI_VERSION}"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create local validator wallet
        shell: bash
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force --outfile "$HOME/.config/solana/id.json"

      - name: Sync localnet program id
        run: anchor keys sync

      - name: Validate
        run: yarn validate:local

      - name: Write artifact checksums
        shell: bash
        run: |
          mkdir -p ci-artifacts
          shasum -a 256 \
            target/deploy/kamino_meta_vault.so \
            target/idl/kamino_meta_vault.json \
            target/types/kamino_meta_vault.ts > ci-artifacts/sha256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: kamino-meta-vault-build
          if-no-files-found: error
          retention-days: 30
          path: |
            ci-artifacts/sha256.txt
            target/deploy/kamino_meta_vault.so
            target/idl/kamino_meta_vault.json
            target/types/kamino_meta_vault.ts
