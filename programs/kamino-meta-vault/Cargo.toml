[package]
name = "kamino-meta-vault"
version = "0.1.0"
description = "Bonded MetaDAO-style curator selection for Kamino vault strategies"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "kamino_meta_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.0", features = ["init-if-needed"] }
anchor-spl = "1.0.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
